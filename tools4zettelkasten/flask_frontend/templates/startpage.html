<!doctype html>
<!-- startpage.html -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zettelkasten</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <style>
    /* Keep the collection buttons visible: let long filenames wrap instead
       of pushing the action column out of the viewport. */
    table {
      width: 100%;
    }

    td a {
      word-break: break-all;
    }
  </style>
</head>
<body class="d-flex flex-column h-100">
  <main class="flex-shrink-0">
    <div class="container">
      <div class="d-flex flex-wrap gap-2 my-3">
        <a href="{{ url_for('svggraph') }}" class="btn btn-primary">Zettelkasten as a Graphic</a>
        <a href="{{ url_for('chat_view') }}" class="btn btn-success">Chat with Zettelkasten</a>
        <a href="{{ url_for('collection') }}" class="btn btn-outline-primary">
          Collection <span class="badge bg-secondary" data-collection-count>0</span>
        </a>
      </div>
      <table border = 1>
        {% for note in zettelkasten %}
        <tr data-filename="{{ note.filename }}" data-ordering="{{ note.ordering }}">
          <th> {{ loop.index }} </th>
          <td> <a href="{{ url_for('show_md_file', file = note.filename) }}"> {{ note.filename }} </a> </td>
          <td class="text-nowrap">
            <button type="button" class="btn btn-sm btn-outline-primary"
                    data-collection-toggle
                    data-filename="{{ note.filename }}"
                    data-labels="+ Collection|&check; In collection"
                    aria-pressed="false">+ Collection</button>
            {% if note.has_subtree %}
            <button type="button" class="btn btn-sm btn-outline-secondary"
                    data-collection-subtree
                    data-filename="{{ note.filename }}"
                    title="Add this note and all its descendants">+ Subtree</button>
            {% endif %}
          </td>
        </tr>
        {% endfor %}
      </table>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js" integrity="sha384-b5kHyXgcpbZJO/tY9Ul7kGkf1S0CWuKcCD38l8YkeH8z8QjE0GmW1gYU5S9FOnJ0" crossorigin="anonymous"></script>
  <script src="{{ url_for('static', filename='js/collection.js') }}"></script>
</body>
</html>
